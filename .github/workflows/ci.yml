name: ci
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # Unit tests cover the pure-Python guardrail/citation logic, so CI needs no models or GPU
      - run: pip install pytest ruff python-dotenv pandas
      - run: ruff check src tests eval app
      - run: pytest -q
