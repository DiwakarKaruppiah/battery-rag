[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mgrag"
version = "0.1.0"
description = "Production-style multimodal RAG over magnesium-battery literature from Zotero, with cited answers, abstention guardrails and evaluation."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "docling>=2.30",
  "qdrant-client[fastembed]>=1.12",
  "sentence-transformers>=3.0",
  "litellm>=1.50",
  "pyzotero>=1.6",
  "python-dotenv>=1.0",
  "pydantic>=2.6",
  "pandas>=2.1",
  "streamlit>=1.40",
  "plotly>=5.20",
  "duckdb>=1.1",
  "mcp>=1.2",
]

[project.optional-dependencies]
eval = [
  "ragas==0.4.3",
  "langchain-community>=0.3",
  "langchain-litellm>=0.2",
  "langchain-huggingface>=0.1",
]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
